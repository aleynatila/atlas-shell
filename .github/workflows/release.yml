name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "tauri-${{ runner.os }}"

      # libssh2 is built against a vendored OpenSSL (curve25519/ecdh KEX needed by
      # modern OpenSSH servers). OpenSSL's Configure needs a full Perl, so make
      # sure Strawberry Perl wins over Git's stripped-down perl on PATH.
      - name: Ensure Strawberry Perl
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Strawberry\perl\bin\perl.exe")) {
            choco install strawberryperl -y --no-progress
          }
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Strawberry\c\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "Atlas v__VERSION__"
          releaseBody: |
            ## Atlas v__VERSION__

            Download the installer below — Atlas will also prompt you to update automatically if you have a previous version installed.

            ### Installation
            Run `atlas___VERSION___x64-setup.exe` and follow the prompts.
          releaseDraft: false
          prerelease: false
