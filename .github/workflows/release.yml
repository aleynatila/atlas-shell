name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri app
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate updater manifest
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          SIG_FILE="src-tauri/target/release/bundle/nsis/atlas_${VERSION}_x64-setup.nsis.zip.sig"
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/atlas_${VERSION}_x64-setup.nsis.zip"
          printf 'Atlas v%s\n\n- Scripts bar folder filtering — scripts tagged with a group only show for sessions in that group\n- Dynamic version in About tab — now fetched from Tauri runtime\n- Terminal scrollback increased to 5000 lines; disableAlternateScreen mode clears nano output cleanly on exit\n- Export settings fixed for Tauri webview\n- Various stability improvements' "$VERSION" > /tmp/release-notes.txt
          node scripts/generate-updater-manifest.mjs "$VERSION" /tmp/release-notes.txt "$SIG_FILE" "$ASSET_URL" latest.json

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: /tmp/release-notes.txt
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
