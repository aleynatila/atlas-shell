name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "tauri-${{ runner.os }}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          tagName: v__VERSION__
          releaseName: "Atlas v__VERSION__"
          releaseBody: |
            ## Atlas v__VERSION__

            Download the installer below — Atlas will also prompt you to update automatically if you have a previous version installed.

            ### Installation
            Run `atlas___VERSION___x64-setup.exe` and follow the prompts.
          releaseDraft: false
          prerelease: false
