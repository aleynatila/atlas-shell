[package]
name = "atlas-tauri"
version = "0.2.3"
edition = "2021"
build = "build.rs"

[dependencies]
tauri = { version = "1.4.2", features = [ "updater", "api-all"] }
ssh2 = "0.9"
once_cell = "1.17"
uuid = { version = "1.1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
keyring = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[build-dependencies]
tauri-build = { version = "1.4.2", features = [] }
